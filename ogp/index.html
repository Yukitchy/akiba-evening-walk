<!DOCTYPE html>

<head>

<title>OGP candidates — Akihabara After Dark</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #070918; color: #edefff; font-family: "Helvetica Neue", Arial, sans-serif; padding: 40px 20px 64px; }

  figure { max-width: 1200px; margin: 0 auto 44px; }
  figcaption { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }

  .name { font-size: 16px; font-weight: 700; letter-spacing: .03em; }

<body>
<header>
  <h1>OGP候補 — Akihabara After Dark</h1>
  <p>夜の秋葉原ツアーページ（akiba-evening-walk）の OGP（1200×630）候補5案。実寸表示。写真はすべてページ掲載中のユウキ本人の写真です。現在の og:image はまだ変更していません。番号で選んでください。</p>
</header>

<figure>
  <figcaption><span class="num">1</span><span class="name">Shrine Panel</span><span class="desc">神田明神の夜写真を右に、左の濃紺パネルにチップとタイトルを集約した分割構成</span></figcaption>
  <img src="ogp-1.jpg" alt="Candidate 1: split layout, navy panel with pink chip and title, Kanda Myojin at night on the right">
</figure>

<figure>

  <img src="ogp-2.jpg" alt="Candidate 2: Chuo-dori neon billboards full-bleed, oversized pink chip, cyan second title line">
</figure>

<figure>
  <figcaption><span class="num">3</span><span class="name">Ameyoko Big Type</span><span class="desc">アメ横を上から撮った写真に、特大のタイポグラフィを載せた構成</span></figcaption>
  <img src="ogp-3.jpg" alt="Candidate 3: Ameyoko market from above, giant After Dark typography">
</figure>

<figure>

  <img src="ogp-4.jpg" alt="Candidate 4: three route photos side by side, title band below">

<figure>
  <figcaption><span class="num">5</span><span class="name">Under the Tracks</span><span class="desc">御徒町の高架下の写真をそのまま見せ、文字は最小限にした写真主役の構成</span></figcaption>
